<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cartas Tseyor — Tirada de tres cartas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <p class="app-kicker">Cartas Tseyor</p>
      <h1 class="app-title">Saca tus cartas</h1>
    </header>

    <!-- El render de app.js reemplaza el contenido de #app según el estado. -->
    <main id="app" class="app-stage"></main>

    <!-- Diálogo de revisión: HERMANO de #app (hijo directo de <body>,
         position:fixed). Así #app puede quedar inert con el diálogo abierto
         (REVIEW-2/3) sin inerte el propio diálogo. El contenido lo construye
         app.js de forma imperativa (T9 abrir / T10 cerrar). -->
    <div id="dialog-root" class="dialog-root"></div>

    <!-- Región aria-live persistente, fuera de #app para que el render no la toque. -->
    <div id="live" class="visually-hidden" aria-live="polite"></div>

    <!-- Scripts planos, en este orden: deck.js (datos) antes de app.js (lógica). -->
    <script src="deck.js"></script>
    <script src="app.js"></script>
  </body>
</html>
